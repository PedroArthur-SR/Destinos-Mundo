<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Usuário</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container">
<div class="row justify-content-center mt-5">
<div class="col-md-4">
<div class="card">
<div class="card-header">
<h3>Criar Conta</h3>
</div>
<div class="card-body">

<form id="cadastro-form">
  <div class="mb-3">
    <label class="form-label">Nome</label>
    <input type="text" class="form-control" id="nome" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Login</label>
    <input type="text" class="form-control" id="login" required>
  </div>
  <div class="mb-3">
    <label class="form-label">E-mail</label>
    <input type="email" class="form-control" id="email" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Senha</label>
    <input type="password" class="form-control" id="senha" required>
  </div>
  <button type="submit" class="btn btn-dark w-100">Cadastrar</button>
</form>

<div id="erro" class="alert alert-danger mt-3 d-none">
  Esse login já está em uso. Escolha outro.
</div>
<div id="sucesso" class="alert alert-success mt-3 d-none">
  Conta criada com sucesso! <a href="login.html">Entrar</a>
</div>

</div>
</div>
</div>
</div>
</div>

<script>
const API_URL = "http://localhost:3001";

document.getElementById("cadastro-form").addEventListener("submit", async (e) => {
  e.preventDefault();

  const nome = document.getElementById("nome").value.trim();
  const login = document.getElementById("login").value.trim();
  const email = document.getElementById("email").value.trim();
  const senha = document.getElementById("senha").value;

  const respUsuarios = await fetch(`${API_URL}/usuarios`);
  const usuarios = await respUsuarios.json();

  const jaExiste = usuarios.some(u => u.login === login);

  if (jaExiste) {
    document.getElementById("erro").classList.remove("d-none");
    document.getElementById("sucesso").classList.add("d-none");
    return;
  }

  const novoUsuario = { nome, login, email, senha, admin: false };

  const resp = await fetch(`${API_URL}/usuarios`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(novoUsuario)
  });

  if (resp.ok) {
    document.getElementById("erro").classList.add("d-none");
    document.getElementById("sucesso").classList.remove("d-none");
    document.getElementById("cadastro-form").reset();
  } else {
    document.getElementById("erro").classList.remove("d-none");
  }
});
</script>

</body>
</html>
